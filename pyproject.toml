[project]
name = "leadbench"
version = "0.1.0"
description = "Lead Economics Benchmark: does decision-centric modelling beat end-to-end analytics, lead scoring, uplift and bandits on realized economic value?"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "statsmodels>=0.14",
    "pyarrow>=15.0",
    "joblib>=1.3",
    "pulp>=2.8",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Gradient boosting + mature causal/uplift/bandit stacks.
ml = [
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "econml>=0.15",
    "scikit-uplift>=0.5",
    "vowpalwabbit>=9.9",
]
# Bayesian stack. Heavier; isolated so the core benchmark runs without it.
bayes = [
    "pymc>=5.16",
    "arviz>=0.18",
]
# Marketing mix modelling candidates.
mmm = [
    "pymc-marketing>=0.7",
]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.2",
]

[project.scripts]
leadbench = "leadbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leadbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=900"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
